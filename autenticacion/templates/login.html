<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Login</title></head>
  <body>
    <h1>Iniciar sesión</h1>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Entrar</button>
    </form>
  </body>
</html>
