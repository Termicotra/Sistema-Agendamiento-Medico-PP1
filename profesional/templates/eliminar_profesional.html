{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-body text-center">
            <h1 class="h4 mb-3">Eliminar Profesional</h1>
            <p>¿Estás seguro de que deseas eliminar a {{ profesional.nombre }} {{ profesional.apellido }}?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Eliminar</button>
            </form>
            <a href="{% url 'listar_profesionales' %}" class="btn btn-link mt-3">Cancelar</a>
        </div>
    </div>
</div>
{% endblock %}
