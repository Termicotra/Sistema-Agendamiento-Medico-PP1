{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-body text-center">
            <h1 class="h4 mb-3">Eliminar Detalle de Factura</h1>
            <p>¿Estás seguro de que deseas eliminar el detalle ID {{ detalle.id_detalle_factura }} de la factura {{ detalle.factura.id_facturacion }}?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Eliminar</button>
            </form>
            <a href="{% url 'detalle_facturacion' detalle.factura.pk %}" class="btn btn-link mt-3">Cancelar</a>
        </div>
    </div>
</div>
{% endblock %}
