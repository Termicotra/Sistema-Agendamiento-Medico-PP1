{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-body text-center">
            <h1 class="h4 mb-3">Anular Facturación</h1>
            <p>¿Estás seguro de que deseas anular la facturación ID {{ facturacion.id_facturacion }}?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Anular</button>
            </form>
            <a href="{% url 'listar_facturaciones' %}" class="btn btn-link mt-3">Cancelar</a>
        </div>
    </div>
</div>
{% endblock %}
