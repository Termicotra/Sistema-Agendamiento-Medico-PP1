<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Agendamiento Médico{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'menu_principal' %}">
                <i class="bi bi-hospital"></i> Agendamiento Médico
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Centered user info (visible when authenticated) -->
            <div class="mx-auto text-center d-flex align-items-center" style="gap:0.5rem;">
                {% if request.user.is_authenticated %}
                    <span class="navbar-text text-white fw-semibold">{{ request.user.username }}</span>
                    <form method="post" action="{% url 'autenticacion:logout' %}" class="d-inline ms-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-light">Cerrar sesión</button>
                    </form>
                {% endif %}
            </div>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'listar_pacientes' %}"><i class="bi bi-people"></i> Pacientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'listar_turnos' %}"><i class="bi bi-calendar-check"></i> Turnos</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'listar_profesionales' %}"><i class="bi bi-person-badge"></i> Profesionales</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'listar_empleados' %}"><i class="bi bi-person-workspace"></i> Empleados</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
