{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <h1 class="h4 text-center mb-4">Editar Paciente</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Actualizar</button>
            </form>
            <a href="{% url 'listar_pacientes' %}" class="btn btn-link mt-3">Volver a la lista de pacientes</a>
        </div>
    </div>
</div>
{% endblock %}
