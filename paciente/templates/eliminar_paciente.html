{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-lg-6">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-danger text-white text-center">
                <h3 class="mb-0"><i class="bi bi-trash-fill"></i> Eliminar Paciente</h3>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">¿Estás seguro de que deseas eliminar a <strong>{{ paciente.nombre }} {{ paciente.apellido }}</strong>?</p>
                <form method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">
                        <i class="bi bi-trash"></i> Eliminar
                    </button>
                    <a href="{% url 'listar_pacientes' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
