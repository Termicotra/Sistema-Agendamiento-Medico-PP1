{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-body text-center">
            <h1 class="h4 mb-3">Cancelar Turno</h1>
            <p>¿Estás seguro de que deseas cancelar el turno ID {{ turno.id_turno }}?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Cancelar Turno</button>
            </form>
            <a href="{% url 'listar_turnos' %}" class="btn btn-link mt-3">Volver</a>
        </div>
    </div>
</div>
{% endblock %}
